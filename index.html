<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beer Views</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f8f6f1;
      color: #333;
      text-align: center;
      padding: 2rem;
    }
    header {
      background: #ffe082;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 2rem;
    }
    h1 {
      margin: 0;
    }
    .beer {
      background: white;
      margin: 1rem auto;
      padding: 1rem;
      max-width: 400px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .beer img {
      width: 100%;
      border-radius: 10px;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍺 Beer Views</h1>
    <p>Sharing honest opinions on great brews</p>
  </header>

  <section>
    <div class="beer">
      <img src="https://images.unsplash.com/photo-1541558619105-3386a7423b5a" alt="Beer glass">
      <h2>Cold Hop IPA</h2>
      <p>Refreshing and bright with citrus notes. Perfect for summer evenings.</p>
    </div>

    <div class="beer">
      <img src="https://images.unsplash.com/photo-1527169402691-a3f4666e6943" alt="Dark beer">
      <h2>Midnight Stout</h2>
      <p>Rich, smooth, and chocolatey — a true winter comfort beer.</p>
    </div>
  </section>

  <footer>
    © 2025 Beer Views | Brewed with 🍺 and good vibes
  </footer>
</body>
</html>
